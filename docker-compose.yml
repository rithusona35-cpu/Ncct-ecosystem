version: '3.8'

services:
  # ==============================================================================
  # NCCT FastAPI Backend
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ncct_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./ncct_auth.db}
      - SECRET_KEY=${SECRET_KEY:-ncct-default-secret-jwt-key-2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
      - ENVIRONMENT=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ncct_backend_data:/app/data
      - ncct_backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ncct_network

  # ==============================================================================
  # NCCT Next.js Frontend
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ncct_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ncct_network

volumes:
  ncct_backend_data:
  ncct_backend_uploads:

networks:
  ncct_network:
    driver: bridge
