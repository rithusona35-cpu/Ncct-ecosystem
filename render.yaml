# ==============================================================================
# Render Infrastructure Blueprint for NCCT Ecosystem
# Deploys Managed PostgreSQL + FastAPI Backend + Next.js Frontend in 1 Click
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend (Docker with Gunicorn/Uvicorn multi-worker)
  # ----------------------------------------------------------------------------
  - type: web
    name: ncct-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ncct-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://ncct-frontend.onrender.com"
      - key: ENVIRONMENT
        value: "production"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TIMEOUT
        value: "120"
      - key: GEMINI_API_KEY
        value: "AIzaSyDemoNCCTAssistantKey2026Secure"

  # ----------------------------------------------------------------------------
  # 2. Next.js Frontend (Docker Standalone)
  # ----------------------------------------------------------------------------
  - type: web
    name: ncct-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://ncct-backend.onrender.com"

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database (Free Tier)
# ------------------------------------------------------------------------------
databases:
  - name: ncct-postgres
    plan: free
    region: oregon
    databaseName: ncct_prod
    user: ncct_admin
