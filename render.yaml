services:
  - type: web
    name: mineguardai-backend
    env: python
    region: oregon
    plan: free
    branch: minegaurdai-backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn fastapi_app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: "8000"
